services:

  bitbag.payu_plugin.action.capture:
    class: BitBag\SyliusPayUPlugin\Action\CaptureAction
    arguments:
      - '@bitbag.payu_plugin.bridge.open_payu'
      - '@bitbag.payu_plugin.provider.payment_description_provider'
    tags:
      - { name: 'payum.action', factory: 'payu', alias: 'payum.action.capture' }

  bitbag.payu_plugin.action.notify:
    class: BitBag\SyliusPayUPlugin\Action\NotifyAction
    arguments:
      - '@bitbag.payu_plugin.bridge.open_payu'
    tags:
      - { name: 'payum.action', factory: 'payu', alias: 'payum.action.notify' }

  bitbag.payu_plugin.action.status:
    class: BitBag\SyliusPayUPlugin\Action\StatusAction
    arguments:
      - '@bitbag.payu_plugin.bridge.open_payu'
    tags:
      - { name: 'payum.action', factory: 'payu', alias: 'payum.action.status' }

  bitbag.payu_plugin.action.convert_payment:
    class: BitBag\SyliusPayUPlugin\Action\ConvertPaymentAction
    tags:
      - { name: 'payum.action', factory: 'payu', alias: 'payum.action.convert_payment' }
